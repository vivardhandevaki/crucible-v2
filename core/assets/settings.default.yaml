# Team convenience config (committed) — charter §Three Config Layers.
#
# NEVER read by any enforcement path: only provider selection (`agent:`), model routing (`models:`), and team
# notify channels (`notify:`) live here. Convenience never enforces, so nothing
# in this file can change what merges. Personal overrides go in the gitignored
# `.crucible/local.yaml`, which deep-merges over this file.
agent:
  # New projects use Codex. Existing projects without this block retain Claude Code.
  provider: codex

# Per-role model routing for the selected provider. Omit a role to use Crucible's
# built-in default. Codex defaults: Sol/Terra/Sol. Claude Code keeps its legacy
# Opus/Opus/Haiku defaults. Explicit values are opaque provider model IDs.
models: {}

# Team notify channels (terminal is always on). Examples:
# notify:
#   slack: "#your-channel"
#   webhook: "https://example.com/hook"
notify: {}
