# Crucible JVM enforcement — the required merge gate for a Crucible-governed
# Java/JUnit repo. This variant preserves the base target-branch enforcement
# workflow and additionally provisions JDK 17 plus a fail-closed Docker service
# check for Testcontainers integration oracles (P3-07).
#
# WHAT THIS IS: the reusable workflow shipped to *consumer* repositories — NOT the
# Crucible framework's own CI (that is .github/workflows/ci.yml, which builds and
# tests the framework). Copy this file to `.github/workflows/crucible.yml` in a
# governed repo and mark the `verify` job a required status check in branch
# protection. `crucible init` (P2) installs and pins this for you; in Phase 1 it
# is installed by hand (design phase-0-1.md §9).
#
# THE TARGET-BRANCH RULE (charter §The Target-Branch Rule; invariant #7): the
# enforcement config (crucible.yaml — risk globs, tiers) is read from the branch
# being merged INTO, never from the PR head. A PR that loosens its own globs
# achieves nothing for that PR: this workflow extracts crucible.yaml from
# origin/<base_ref> and hands it to verify via `--config-from`. The rules that
# judge you are the rules already on the target branch. Convenience config
# (.crucible/settings.yaml, local.yaml) is never read here — it cannot affect
# enforcement by construction.
#
# ── ROUTING (P2-03) ──────────────────────────────────────────────────────────
# As of P2-03 `crucible verify` CONSUMES the target-branch enforcement config: it
# recomputes the tier from the diff against origin/<base_ref> (invariant #8),
# enforces the per-tier diff cap (a breach → red verdict), and emits a routing
# decision (auto | human) in its --json report. This workflow has TWO required
# jobs: `verify` (the green/red gate) and `route` (needs: verify), which holds a
# critical change red until a non-author APPROVED review exists. The
# `pull_request_review` trigger re-evaluates the check the moment that approval
# lands. Trivial/standard green → auto path; critical → required human review.
#
# The behavioral proof that a loosened-glob PR still routes to human because CI
# used the target-branch config is P2-18's hermetic anchor
# (core/test/target-branch-rule.test.ts); this file's structure is asserted by
# src/crucible-template.test.ts.
#
# ── OVERRIDE (P2-06) ─────────────────────────────────────────────────────────
# An override.yaml in a change bundle is the 2am escape hatch (charter §Override).
# `crucible verify` then emits verdict green-with-`override`, forces its routing
# decision to `human` regardless of tier (so `route` requires a human approval),
# AND emits a ratchet-issue payload in its --json report. The verify job files
# that issue idempotently via the ambient GITHUB_TOKEN (`issues: write`): it
# searches OPEN `crucible-override`-labeled issues for the change first and creates
# one only if none exists. The issue stays open until a retroactive proposal lands
# — "instant to use, impossible to use quietly." Local runs never file issues
# (invariant #11: convenience never enforcement).
# ─────────────────────────────────────────────────────────────────────────────
#
# The framework source used by this workflow is also read from the target branch:
# `.crucible/framework.lock.json` names an immutable GitHub commit. This keeps a
# PR from selecting the version of the enforcement harness that judges itself,
# while allowing Phase 4 validation before public npm distribution exists.
# ─────────────────────────────────────────────────────────────────────────────

name: Crucible

on:
  pull_request_target: # Re-run when a review is submitted/dismissed so `route` re-checks approval and

  # the required check flips green the moment a non-author approves.
  pull_request_review:

    # `route` reads the PR's reviews via the ambient GITHUB_TOKEN (workflow-level
    # perms). `verify` escalates its own job-level perms: `issues: write` to file an
    # override ratchet issue, `pull-requests: write` to post the reviewer's
    # observations comment (P2-10). Least privilege (invariant: harness is TCB).
permissions:
  contents: read
  pull-requests: read

jobs:
  # The green/red gate. A red verify verdict is exit 1; any non-zero step exit
  # fails the job → the required check goes red. There is deliberately no
  # `continue-on-error` and no `|| true`: the gate must not be silently
  # satisfiable (fail-closed, invariant #3). Its `routing` output feeds `route`.
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout candidate head (exact event SHA)
        id: candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Set up Java for JUnit oracles
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Confirm Docker service for Testcontainers
        run: |
          set -euo pipefail
          docker info
      - name: Download authority handoff
        uses: actions/download-artifact@v4
        with:
          name: crucible-authority
          path: ${{ runner.temp }}/crucible-authority
      - name: Checkout pinned Crucible framework
        uses: actions/checkout@v4
        with:
          repository: ${{ needs.authority.outputs.repository }}
          ref: ${{ needs.authority.outputs.commit }}
          path: crucible-framework
          persist-credentials: false
      - name: Build pinned Crucible framework
        working-directory: crucible-framework
        run: |
          set -euo pipefail
          npm ci
          npm run build
      - name: Verify authority-authorized candidate
        id: verify
        run: >-
          set -euo pipefail

          HANDOFF="$RUNNER_TEMP/crucible-authority"

          MANIFEST="$HANDOFF/authority.json"

          SNAPSHOT="$HANDOFF/snapshot"

          lane="$(jq -r .lane "$MANIFEST")"

          case "$lane" in

          governed)
            jq -r '.changes[]' "$MANIFEST" | while IFS= read -r change; do
              echo "::group::crucible ci verify $change"
              node "$GITHUB_WORKSPACE/crucible-framework/core/dist/cli/bin.js" --json --config-from "$SNAPSHOT" ci verify "$change" --manifest "$MANIFEST"
              echo "::endgroup::"
            done
            ;;
          archive)
            node "$GITHUB_WORKSPACE/crucible-framework/core/dist/cli/bin.js" --json --config-from "$SNAPSHOT" ci verify --manifest "$MANIFEST"
            ;;
          framework-bootstrap|authority-finalization)
            echo "Authority lane $lane has no candidate oracle execution."
            ;;
          *)
            echo "Unknown authority lane: $lane" >&2
            exit 1
            ;;
          esac
    needs: authority

  # Credential-separated authority: this job reads candidate bytes as data and
  # recomputes routing with target config/pin. It never consumes verify outputs.
  route:
    needs:
      - authority
      - verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: write
    steps:
      - name: Checkout candidate data (exact event SHA)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Download authority handoff
        uses: actions/download-artifact@v4
        with:
          name: crucible-authority
          path: ${{ runner.temp }}/crucible-authority
      - name: Checkout target-pinned Crucible framework
        uses: actions/checkout@v4
        with:
          repository: ${{ needs.authority.outputs.repository }}
          ref: ${{ needs.authority.outputs.commit }}
          path: crucible-framework
          persist-credentials: false
      - name: Build target-pinned Crucible framework
        working-directory: crucible-framework
        run: |
          set -euo pipefail
          npm ci
          npm run build
      - name: Recompute route and enforce independent review
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: >
          set -euo pipefail

          report="$(node
          "$GITHUB_WORKSPACE/crucible-framework/core/dist/cli/bin.js" --json
          --config-from "$RUNNER_TEMP/crucible-authority/snapshot" ci route
          --manifest "$RUNNER_TEMP/crucible-authority/authority.json")"

          printf '%s\n' "$report"

          routing="$(printf '%s' "$report" | jq -r '.routing.decision')"

          if [ "$routing" != "human" ]; then
            echo "Routing is '$routing' — auto-merge path."
            exit 0
          fi

          approved="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/reviews"
          --jq "[.[] | select(.state == \"APPROVED\" and .user.login !=
          \"$PR_AUTHOR\")] | length")"

          if [ "$approved" -gt 0 ]; then
            echo "Found a non-author APPROVED review — human routing satisfied."
            exit 0
          fi

          echo "No non-author APPROVED review yet — this check stays red until
          one lands."

          exit 1
  authority:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      repository: ${{ steps.target.outputs.repository }}
      commit: ${{ steps.target.outputs.commit }}
      base_sha: ${{ steps.target.outputs.base_sha }}
      head_sha: ${{ steps.target.outputs.head_sha }}
    steps:
      - name: Checkout candidate head (exact event SHA)
        id: candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Mint complete target-branch enforcement snapshot and framework pin
        id: target
        run: |
          set -euo pipefail
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          TARGET="$BASE_SHA"
          SNAPSHOT_PARENT="$RUNNER_TEMP/crucible-target"
          mkdir -p "$SNAPSHOT_PARENT"
          SNAPSHOT="$(mktemp -d "$SNAPSHOT_PARENT/snapshot.XXXXXX")"
          REVIEW_WORKFLOW=".github/workflows/crucible-review.yml"
          git fetch --no-tags origin "$BASE_SHA"
          git cat-file -e "$HEAD_SHA^{commit}"
          mkdir -p "$SNAPSHOT/.crucible" "$SNAPSHOT/.github/workflows"

          require_regular_target_file() {
            local path="$1"
            local entry
            entry="$(git ls-tree "$TARGET" -- "$path")"
            case "$entry" in
              $'100644 blob '*$'\t'"$path") ;;
              *)
                echo "Target enforcement snapshot requires regular file: $path" >&2
                exit 1
                ;;
            esac
          }

          require_regular_target_file "crucible.yaml"
          require_regular_target_file ".crucible/framework.lock.json"
          require_regular_target_file ".github/workflows/crucible.yml"
          git show "$TARGET:crucible.yaml" > "$SNAPSHOT/crucible.yaml"
          git show "$TARGET:.crucible/framework.lock.json" > "$SNAPSHOT/.crucible/framework.lock.json"
          git show "$TARGET:.github/workflows/crucible.yml" > "$SNAPSHOT/.github/workflows/crucible.yml"

          review_entry="$(git ls-tree "$TARGET" -- "$REVIEW_WORKFLOW")"
          if [ -n "$review_entry" ]; then
            case "$review_entry" in
              $'100644 blob '*$'\t'"$REVIEW_WORKFLOW") ;;
              *)
                echo "Target enforcement snapshot has invalid optional workflow: $REVIEW_WORKFLOW" >&2
                exit 1
                ;;
            esac
            git show "$TARGET:.github/workflows/crucible-review.yml" > "$SNAPSHOT/.github/workflows/crucible-review.yml"
          fi

          SNAPSHOT="$SNAPSHOT" BASE_SHA="$BASE_SHA" HEAD_SHA="$HEAD_SHA" node <<'NODE'
          const fs = require('node:fs');
          const lockPath = `${process.env.SNAPSHOT}/.crucible/framework.lock.json`;
          const value = JSON.parse(fs.readFileSync(lockPath, 'utf8'));
          const keys = Object.keys(value).sort();
          if (keys.join(',') !== 'commit,repository,version' || value.version !== 1
            || typeof value.repository !== 'string'
            || !/^[A-Za-z0-9._-]+\/[A-Za-z0-9._-]+$/.test(value.repository)
            || typeof value.commit !== 'string' || !/^[0-9a-f]{40}$/.test(value.commit)) {
            throw new Error(`Invalid framework pin at ${lockPath}`);
          }
          fs.appendFileSync(
            process.env.GITHUB_OUTPUT,
            `snapshot=${process.env.SNAPSHOT}\nrepository=${value.repository}\ncommit=${value.commit}\nbase_sha=${process.env.BASE_SHA}\nhead_sha=${process.env.HEAD_SHA}\n`,
          );
          NODE
      - name: Checkout pinned Crucible framework
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.target.outputs.repository }}
          ref: ${{ steps.target.outputs.commit }}
          path: crucible-framework
          persist-credentials: false
      - name: Build pinned Crucible framework
        working-directory: crucible-framework
        run: |
          set -euo pipefail
          npm ci
          npm run build
      - name: Mint authority handoff
        id: authority
        run: >-
          set -euo pipefail
                    HANDOFF="$RUNNER_TEMP/crucible-authority"
                    rm -rf "$HANDOFF"
                    mkdir -p "$HANDOFF"
                    git diff --name-only -z "${{ steps.target.outputs.base_sha }}...${{ steps.target.outputs.head_sha }}" > "$HANDOFF/changed-paths"
                    SNAPSHOT="${{ steps.target.outputs.snapshot }}"
                    SNAPSHOT_HASH="$(find "$SNAPSHOT" -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum | sha256sum | awk '{print $1}')"
                    node "$GITHUB_WORKSPACE/crucible-framework/core/dist/cli/bin.js" --json --config-from "$SNAPSHOT" ci authority \
                      --changed-paths "$HANDOFF/changed-paths" \
                      --base-sha "${{ steps.target.outputs.base_sha }}" \
                      --head-sha "${{ steps.target.outputs.head_sha }}" \
                      --snapshot-hash "$SNAPSHOT_HASH" \
                      --manifest-out "$HANDOFF/authority.json"
                    cp -a "$SNAPSHOT" "$HANDOFF/snapshot"
      - name: Upload authority handoff
        uses: actions/upload-artifact@v4
        with:
          name: crucible-authority
          path: ${{ runner.temp }}/crucible-authority
          if-no-files-found: error
