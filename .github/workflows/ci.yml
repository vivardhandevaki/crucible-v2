name: CI

on:
  push:
    branches: [main]
  pull_request:

# This workflow builds and tests the framework itself. It is NOT the Crucible
# enforcement workflow shipped to consumer repos — that reusable template
# (target-branch enforced) lands in ci-templates/ under P1-15.

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Layering lint
        run: npm run lint:layering

      - name: Typecheck
        run: npm run typecheck

      # The integration tests (adapter client, tracer) spawn the BUILT stub
      # adapter from adapters/stub/dist/ — without a build they fail closed
      # with ADAPTER_TRANSPORT, never a false green.
      - name: Build
        run: npm run build

      - name: Test
        run: npm test
